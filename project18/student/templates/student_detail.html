<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student.name }} - Student Details</title>
</head>
<body>
    <h1>{{ student.name }}</h1>
    <p>Age: {{ student.age }}</p>
    <p>Email: {{ student.email }}</p>
    <p><a href="{% url 'student_edit' student.id %}">Edit Student</a></p>
    <p><a href="{% url 'student_delete' student.id %}">Delete Student</a></p>
    <a href="{% url 'students_list' %}">Back to Students List</a> 
</body>
</html>

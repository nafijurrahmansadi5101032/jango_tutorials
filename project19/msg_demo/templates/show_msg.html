<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Msg Data</title>
    <style>
        .debug { color: gray; }
        .info { color: blue; }
        .success { color: green; }
        .warning { color: orange; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>All Msg Data</h1>
    {% if messages %} 
        <ul>
            {% for message in messages %}
                <li class="{{message.tag}}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No messages available.</p>
    {% endif %}
</body>
</html>
